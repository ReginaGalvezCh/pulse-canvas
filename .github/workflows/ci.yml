name: Check Pulse Canvas
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run package
      # Camera acquisition and Presage credentials are intentionally excluded from CI.
